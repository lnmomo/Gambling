services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - api.env
    environment:
      DATABASE_PATH: /app/data/football_agents.db
      BANKROLL: 10000
    volumes:
      - football_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)); assert r['database']['connected']"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
volumes:
  football_data:

