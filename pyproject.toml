[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "football-betting-agents"
version = "1.0.0"
description = "竞彩足球概率建模、赔率比较、风控与复盘系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
football-agents = "football_agents.cli:main"

[tool.setuptools.package-data]
football_agents = ["web/*", "database/*.sql", "migrations/*.sql", "sample_data/*.csv"]

[tool.setuptools.packages.find]
include = ["football_agents*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
